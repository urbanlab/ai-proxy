name: opencode-security-review

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  issues: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    if: github.actor != 'opencode-bot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OpenCode security review
        uses: anomalyco/opencode/github@latest
        env:
          OPEN_CODE_API_KEY: ${{ secrets.OPEN_CODE_API_KEY }}
          OPEN_CODE_API_URL: ${{ secrets.OPEN_CODE_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: erasme-ai-proxy/qwen3.6
          use_github_token: true
          prompt: |
            You are a security review agent (similar to CodeRabbit) running in CI.
            You have a shell with `git` and the `gh` CLI already authenticated.

            Context for the commit that just triggered this run:
            - Repository:   ${{ github.repository }}
            - Commit SHA:   ${{ github.sha }}
            - Pushed by:    @${{ github.actor }}
            - Commit author (from git metadata) may differ; trust git for the author name.
            - Commit URL:   ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            STEP 1 — Inspect ONLY this commit's changes:
              Run: git show ${{ github.sha }}
              (fallback for the repo's first commit: git show HEAD)
              Review only the lines this commit ADDED or CHANGED. Ignore
              pre-existing problems that are outside this diff.

            STEP 2 — Look for vulnerabilities INTRODUCED by this commit, e.g.:
              - Injection: SQL, command, LDAP, XSS, template (SSTI)
              - Hardcoded secrets, credentials, API keys, tokens
              - Path traversal / arbitrary file read or write
              - Broken authn/authz or missing access checks
              - Insecure deserialization, unsafe eval / dynamic code exec
              - Weak or broken crypto, insecure randomness
              - SSRF, open redirects
              - Newly added dependencies that are known-vulnerable

            STEP 3 — Decide:
              - If you find NO genuine vulnerability: do nothing, print
                "No vulnerabilities found", and stop. Do NOT open an issue.
              - Before opening anything, avoid duplicates:
                  gh issue list --state open --search "Security review ${{ github.sha }}"
                If an issue for this commit already exists, stop.
              - Otherwise create exactly ONE issue:
                  gh issue create \
                    --title "Security review: possible vulnerability in commit <short-sha>" \
                    --body "<body below>"
                If --label security fails because the label doesn't exist,
                retry the command without --label.

            The issue body MUST include:
              - The commit link: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
              - An @mention of the author: @${{ github.actor }}
              - For each finding: severity (Critical/High/Medium/Low), the
                file and line, a one-line description, why it is exploitable,
                and a concrete remediation or code suggestion.

            Be precise, not noisy. Only flag findings you are confident are
            real, exploitable vulnerabilities. Prefer false negatives over
            false positives.
